<!DOCTYPE html>
<html>
<head>
    <title>Lamborghini | Contact</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            padding: 25px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover {
            background-color: orangered;
            padding: 10px;
            border-radius: 8px;
        }

        .stripe {
            position: fixed;
            right: 0;
            top: 0;
            width: 16%;
            height: 100%;
            background-color: orangered;
            z-index: -1;
        }

        .logo {
            position: absolute;
            top: 50px;
            right: 6%;
            width: 80px;
        }

        .title {
            margin: 60px 5% 10px;
            font-size: 60px;
            color: orangered;
        }

        .description {
            margin-left: 5%;
            font-size: 20px;
        }

        .contactbox {
            width: 60%;
            margin: 40px 5%;
            padding: 30px;
            border: 2px solid orangered;
            border-radius: 15px;
            background-color: black;
        }

        input, textarea {
            width: 95%;
            padding: 15px;
            margin: 10px 0 20px;
            background-color: #111;
            border: 1px solid orangered;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        textarea {
            height: 120px;
        }

        button {
            background-color: black;
            color: white;
            border: 2px solid orangered;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: orangered;
        }

        label {
            font-size: 18px;
        }
    </style>
</head>
  <div class="navbar">
        <p class="A1">HOME</p>
   <a href="model.html" class="A2">MODELS</a>
      <a href="contact.html" class="A2">CONTACT</a>
    <p class="A4">SHOWROOMS</p>
    </div>
<body>

    <div class="stripe"></div>

    <img src="logoo.png" class="logo">

    

    <h1 class="title">CONTACT US</h1>

    <p class="description">
        Get in touch with Lamborghini.
        Experience the extraordinary.
    </p>

    <div class="contactbox">

        <h2 style="color:orangered;">GET IN TOUCH</h2>

        <form>

            <label>Your Name</label>
            <br>
            <input type="text" placeholder="Enter your name" required>

            <br>

            <label>Email Address</label>
            <br>
            <input type="email" placeholder="Enter your email" required>

            <br>

            <label>Subject</label>
            <br>
            <input type="text" placeholder="Enter subject">

            <br>

            <label>Your Message</label>
            <br>
            <textarea placeholder="Write your message here"></textarea>

            <br>

            <button type="submit">SEND MESSAGE →</button>

        </form>

    </div>

</body>
</html>
